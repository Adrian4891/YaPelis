{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YaaPelis</title>
    <link rel="stylesheet" href="{% static 'styles/index.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body class="bg-dark">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
          <a class="navbar-brand"href="{% url 'home' %}">
            <img src="../../static/images/yapelis.png" alt="image-title" style="height: 40px;"/>
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li>
                  <a class="nav-link" href="{% url 'home' %}">Home</a>
              </li>
              {% if user.is_authenticated %}
              <li>
                <a class="nav-link" href="{% url 'signOut' %}">SingOut</a>
              </li>
              <li></li>
                <a class="nav-link" href="{% url 'home' %}">{{user}}</a>
              </li>
              {% else %}
              <li></li>
                <a class="nav-link" href="{% url 'signin' %}">SignIn</a>
              </li>
              {% endif %}
              
            </ul>
          </div>
        </div>
    </nav>
    {% block content %}
    {% endblock %}
</body>
</html>
